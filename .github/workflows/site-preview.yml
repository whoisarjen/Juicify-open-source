name: Update site preview

on:
  schedule:
    - cron: '0 0 * * 1' # every Monday
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Take screenshot
        run: |
          node -e "
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 720 } });
            await page.goto('https://juicify.whoisarjen.com', { waitUntil: 'networkidle' });
            await page.screenshot({ path: '.github/preview.png' });
            await browser.close();
          })();
          "

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/preview.png
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update site preview screenshot"
          git push
